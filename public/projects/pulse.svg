      <stop offset="0%" stop-color="#11152c" />
      <stop offset="100%" stop-color="#06060f" />
    </linearGradient>
    <linearGradient id="pulse-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d8ff" />
